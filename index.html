<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="ToDo-table">
      <h1>Todo Input</h1>
      <div class="input-list">
        <div>
          <i class="fa-solid fa-book"></i
          ><input type="text" placeholder="New Todo" id="myInput" />
        </div>
        <p id="inputVal"></p>
        <button id="addTaskButton">Add New Task</button>
      </div>
    </div>
    <div class="buuton-contanir">
      <h1>To Do List</h1>
      <div class="buttonPosition">
        <button id="showAll">All</button>
        <button id="showDone">Done</button>
        <button id="showTodo">To Do</button>
      </div>
      <table id="todoTable">
        <thead></thead>
        <tbody>
          <!-- Tasks will be added here dynamically -->
        </tbody>
      </table>
    </div>
    <!-- Edit Task Modal -->
    <div id="editTaskModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h3>Edit Task</h3>
        <input type="text" id="editTaskInput" placeholder="Edit your task..." />
        <button id="saveEditButton">Save</button>
        <p id="demo"></p>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
